; ============================================
; Şablon: Biges-IVR
; Context: auto-calls-template-14
; ============================================

[auto-calls-template-14]
; Otomatik arama başladığında buraya düşer

exten => s,1,Set(CHANNEL(hangup_handler_push)=auto-calls-template-14,h,1)
    same => n,NoOp(=== Otomatik Arama Başladı - Biges-IVR ===)
    same => n,NoOp(Call ID: ${CALL_ID})
    same => n,NoOp(Phone: ${PHONE_NUMBER})
    same => n,NoOp(Audio: ${AUDIO_FILE})
    same => n,Set(CDR(dst)=${PHONE_NUMBER})  ; CDR'da dst = telefon numarası
    same => n,Set(CDR(userfield)=${CALL_ID})  ; CDR'da userfield = Call ID
    same => n,Set(CHANNEL(language)=tr)
    same => n,Set(ANSWEREDTIME=${EPOCH})
    same => n,Set(LOOP_COUNT=0)
    same => n,Goto(play_message)

; Mesajı çal ve tuş bekle (s extension içinde)
    same => n(play_message),NoOp(=== Mesaj Çalınıyor ===)
    same => n,GotoIf($[${LOOP_COUNT} = 0]?mark_as_answered)
    same => n(continue_loop),Set(LOOP_COUNT=$[${LOOP_COUNT} + 1])
    same => n,GotoIf($[${LOOP_COUNT} > 1]?do_hangup)
    same => n(play_audio),Background(${AUDIO_FILE})
    same => n,WaitExten(5)
    same => n(mark_as_answered),NoOp(=== Arama Cevaplandı ===)
    same => n,AGI(update_call_status.php,${CALL_ID},answered)
    same => n,Goto(continue_loop)
    same => n(do_hangup),NoOp(=== Arama Sonlandırılıyor ===)
    same => n,Set(ENDTIME=${EPOCH})
    same => n,Set(DURATION=$[${ENDTIME} - ${ANSWEREDTIME}])
    same => n,NoOp(Arama süresi: ${DURATION} saniye)
    same => n,Hangup()

    same => n,Goto(play_message)  ; Timeout - tekrar çal

; Tuş 1 Davranışı
exten => 1,1,NoOp(=== Tuş 1: Tekrar Dinle ===)
    same => n,AGI(update_call_dtmf.php,${CALL_ID},1)
    same => n,Set(LOOP_COUNT=0)
    same => n,Goto(s,play_message)

; Tuş 2 Davranışı
exten => 2,1,NoOp(=== Tuş 2: Transfer - 100 ===)
    same => n,AGI(update_call_dtmf.php,${CALL_ID},2)
    same => n,Dial(Local/100@from-internal,300,t)
    same => n,Playback(otomatik/goodbye)
    same => n,Hangup()

; Yanlış tuş davranışı
exten => _X,1,NoOp(=== Yanlış Tuş: ${EXTEN} ===)
    same => n,Goto(1,2)  ; 1 tuşu davranışı

; Hangup handler
exten => h,1,NoOp(=== Arama Bitti ===)
    same => n,NoOp(CALL_ID: ${CALL_ID})
    same => n,NoOp(Dial Status: ${DIALSTATUS})
    same => n,NoOp(Hangup Cause: ${HANGUPCAUSE})
    same => n,GotoIf($["${CALL_ID}" = ""]?end)  ; CALL_ID yoksa normal arama

; DIALSTATUS kontrolü (öncelikli)
    same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?do_busy)
    same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?do_noanswer)
    same => n,GotoIf($["${DIALSTATUS}" = "CONGESTION"]?do_congestion)
    same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?do_congestion)
    same => n,GotoIf($["${DIALSTATUS}" = "CANCEL"]?do_noanswer)

; HANGUPCAUSE kontrolü (yedek)
    same => n,GotoIf($["${HANGUPCAUSE}" = "17"]?do_busy)        ; User busy
    same => n,GotoIf($["${HANGUPCAUSE}" = "18"]?do_noanswer)    ; No user responding
    same => n,GotoIf($["${HANGUPCAUSE}" = "19"]?do_noanswer)    ; No answer
    same => n,GotoIf($["${HANGUPCAUSE}" = "21"]?do_busy)        ; Call rejected
    same => n,GotoIf($["${HANGUPCAUSE}" = "34"]?do_congestion)  ; No circuit
    same => n,GotoIf($["${HANGUPCAUSE}" = "41"]?do_congestion)  ; Temporary failure
    same => n,GotoIf($["${HANGUPCAUSE}" = "42"]?do_congestion)  ; Switching congestion
    same => n,GotoIf($["${HANGUPCAUSE}" = "47"]?do_congestion)  ; Resource unavailable
    same => n,GotoIf($["${HANGUPCAUSE}" = "16"]?end)         ; Normal clearing

; Default: noanswer
    same => n,NoOp(No match, default noanswer)
    same => n,Goto(do_noanswer)

; Noanswer (h extension içinde label)
    same => n(do_noanswer),NoOp(=== Cevapsız ===)
    same => n,AGI(update_call_status.php,${CALL_ID},noanswer)
    same => n,Goto(end)

; Busy (h extension içinde label)
    same => n(do_busy),NoOp(=== Meşgul ===)
    same => n,AGI(update_call_status.php,${CALL_ID},busy)
    same => n,Goto(end)

; Congestion (h extension içinde label)
    same => n(do_congestion),NoOp(=== Tıkanıklık ===)
    same => n,AGI(update_call_status.php,${CALL_ID},congestion)
    same => n,Goto(end)

; End
    same => n(end),Hangup()

