; ============================================
; Şablon: ABC
; Context: auto-calls-template-4
; ============================================

[auto-calls-template-4]
; Otomatik arama başladığında buraya düşer

exten => s,1,NoOp(=== Otomatik Arama Başladı - ABC ===)
    same => n,NoOp(Call ID: ${CALL_ID})
    same => n,NoOp(Phone: ${PHONE_NUMBER})
    same => n,NoOp(Audio: ${AUDIO_FILE})
    same => n,Set(CHANNEL(language)=tr)
    same => n,Set(ANSWEREDTIME=${EPOCH})
    same => n,AGI(update_call_status.php,${CALL_ID},answered)
    same => n,Set(LOOP_COUNT=0)
    same => n,Goto(play-message,1)

; Mesajı çal ve tuş bekle
exten => play-message,1,NoOp(=== Mesaj Çalınıyor ===)
    same => n,Set(LOOP_COUNT=$[${LOOP_COUNT} + 1])
    same => n,GotoIf($[${LOOP_COUNT} > 1]?hangup,1)
    same => n,Background(${AUDIO_FILE})
    same => n,WaitExten(5)
    same => n,Goto(hangup,1)  ; Timeout - kapat

; Tuş 1 Davranışı
exten => 1,1,NoOp(=== Tuş 1: Tekrar Dinle ===)
    same => n,AGI(update_call_dtmf.php,${CALL_ID},1)
    same => n,Set(LOOP_COUNT=0)
    same => n,Goto(play-message,1)

; Tuş 2 Davranışı
exten => 2,1,NoOp(=== Tuş 2: Transfer - 133 ===)
    same => n,AGI(update_call_dtmf.php,${CALL_ID},2)
    same => n,Playback(otomatik/agent-connecting)
    same => n,Dial(Local/133@from-internal,300,t)
    same => n,Playback(otomatik/goodbye)
    same => n,Goto(hangup,1)

; Yanlış tuş davranışı
exten => _X,1,NoOp(=== Yanlış Tuş: ${EXTEN} ===)
    same => n,Goto(1,2)  ; 1 tuşu davranışı

; Arama sonlandır (AGI çağrılmıyor - h extension'ında çağrılacak)
exten => hangup,1,NoOp(=== Arama Sonlandırılıyor ===)
    same => n,Set(ENDTIME=${EPOCH})
    same => n,Set(DURATION=$[${ENDTIME} - ${ANSWEREDTIME}])
    same => n,NoOp(Arama süresi: ${DURATION} saniye)
    same => n,Hangup()

; Hangup handler
exten => h,1,NoOp(=== Arama Bitti ===)
    same => n,NoOp(CALL_ID: ${CALL_ID})
    same => n,NoOp(Hangup Cause: ${HANGUPCAUSE})
    same => n,NoOp(Dial Status: ${DIALSTATUS})
    same => n,GotoIf($["${CALL_ID}" = ""]?end,1)  ; CALL_ID yoksa normal arama
    same => n,GotoIf($["${HANGUPCAUSE}" = "19"]?noanswer,1)  ; 19 = No answer
    same => n,GotoIf($["${HANGUPCAUSE}" = "17"]?busy,1)      ; 17 = User busy
    same => n,GotoIf($["${HANGUPCAUSE}" = "34"]?congestion,1) ; 34 = No circuit
    same => n,GotoIf($["${HANGUPCAUSE}" = "21"]?busy,1)      ; 21 = Rejected (busy)
    same => n,GotoIf($["${HANGUPCAUSE}" = "16"]?end,1)       ; 16 = Normal clearing
    same => n,Goto(noanswer,1)  ; Default: noanswer

exten => end,1,Hangup()

exten => noanswer,1,NoOp(=== Cevapsız ===)
    same => n,AGI(update_call_status.php,${CALL_ID},noanswer)
    same => n,Hangup()

exten => busy,1,NoOp(=== Meşgul ===)
    same => n,AGI(update_call_status.php,${CALL_ID},busy)
    same => n,Hangup()

exten => congestion,1,NoOp(=== Tıkanıklık ===)
    same => n,AGI(update_call_status.php,${CALL_ID},congestion)
    same => n,Hangup()

