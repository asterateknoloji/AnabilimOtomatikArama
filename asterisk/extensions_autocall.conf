; ============================================
; Otomatik Arama Sistemi Dialplan
; ============================================
; Bu dosyayı /etc/asterisk/extensions.conf dosyasına include edin:
; #include extensions_autocall.conf

[auto-calls]
; Otomatik arama başladığında buraya düşer

exten => s,1,NoOp(=== Otomatik Arama Başladı ===)
    same => n,NoOp(Call ID: ${CALL_ID})
    same => n,NoOp(Phone: ${PHONE_NUMBER})
    same => n,NoOp(Audio: ${AUDIO_FILE})
    
    ; Dil ayarını Türkçe yap
    same => n,Set(CHANNEL(language)=tr)
    same => n,NoOp(Dil ayarı: Türkçe)
    
    ; Arama cevaplandı mı kontrolü
    same => n,Set(ANSWEREDTIME=${EPOCH})
    same => n,NoOp(Arama ${ANSWEREDTIME} zamanında cevaplandı)
    
    ; Veritabanına cevaplandığını kaydet (Normal AGI)
    same => n,AGI(update_call_status.php,${CALL_ID},answered)
    
    ; Menü döngüsü başlat
    same => n,Set(LOOP_COUNT=0)
    same => n,Goto(play-message,1)

; Mesajı çal ve tuş bekle
exten => play-message,1,NoOp(=== Mesaj Çalınıyor ===)
    same => n,Set(LOOP_COUNT=$[${LOOP_COUNT} + 1])
    same => n,NoOp(Döngü sayısı: ${LOOP_COUNT})
    
    ; Maksimum 1 deneme (ilk mesajdan sonra tuşlama yoksa kapat)
    same => n,GotoIf($[${LOOP_COUNT} > 1]?hangup,1)
    
    ; Ses dosyasını çal ve DTMF bekle (5 saniye)
    same => n,Background(${AUDIO_FILE})
    same => n,WaitExten(5)
    
    ; Tuş basılmazsa tekrar çal
    same => n,Goto(play-message,1)

; Tuş 1: Mesajı tekrar dinle
exten => 1,1,NoOp(=== Tuş 1 Basıldı: Tekrar Dinle ===)
    same => n,AGI(update_call_dtmf.php,${CALL_ID},1)
    same => n,Set(LOOP_COUNT=0)
    same => n,Goto(play-message,1)

; Tuş 2: Operatöre aktar
exten => 2,1,NoOp(=== Tuş 2 Basıldı: Operatöre Aktar ===)
    same => n,AGI(update_call_dtmf.php,${CALL_ID},2)
    same => n,Playback(otomatik/transfer)  ; "Lütfen bekleyiniz, operatöre aktarılıyorsunuz"
    
    ; Operatör kuyruğuna aktar
    same => n,Queue(TAHSILAT,t,,,300)
    
    ; Kuyruk cevap vermediyse
    same => n,Playback(otomatik/goodbye)
    same => n,Goto(hangup,1)

; Tuş 3: Rezerve (ileride kullanılabilir)
exten => 3,1,NoOp(=== Tuş 3 Basıldı ===)
    same => n,AGI(update_call_dtmf.php,${CALL_ID},3)
    same => n,Playback(otomatik/invalid)
    same => n,Goto(play-message,1)

; Geçersiz tuş
exten => i,1,NoOp(=== Geçersiz Tuş ===)
    same => n,Playback(otomatik/invalid)
    same => n,Goto(play-message,1)

; Timeout (tuş basılmazsa)
exten => t,1,NoOp(=== Timeout ===)
    same => n,Playback(otomatik/goodbye)
    same => n,Goto(hangup,1)

; Arama sonlandır
exten => hangup,1,NoOp(=== Arama Sonlandırılıyor ===)
    same => n,Set(ENDTIME=${EPOCH})
    same => n,Set(DURATION=$[${ENDTIME} - ${ANSWEREDTIME}])
    same => n,NoOp(Arama süresi: ${DURATION} saniye)
    
    ; Veritabanına sonucu kaydet
    same => n,AGI(update_call_end.php,${CALL_ID},${DURATION})
    same => n,Hangup()

; Arama cevapsız
exten => h,1,NoOp(=== Arama Bitti ===)
    same => n,NoOp(Hangup Cause: ${HANGUPCAUSE})
    same => n,NoOp(Dial Status: ${DIALSTATUS})
    
    ; Cevapsız veya meşgul durumu kaydet
    same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer,1)
    same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy,1)
    same => n,GotoIf($["${DIALSTATUS}" = "CONGESTION"]?congestion,1)
    
    ; Normal kapanış - arama tamamlandı
    same => n,AGI(update_call_end.php,${CALL_ID},completed)
    same => n,Hangup()

; Cevapsız
exten => noanswer,1,NoOp(=== Cevapsız ===)
    same => n,AGI(update_call_status.php,${CALL_ID},noanswer)
    same => n,Hangup()

; Meşgul
exten => busy,1,NoOp(=== Meşgul ===)
    same => n,AGI(update_call_status.php,${CALL_ID},busy)
    same => n,Hangup()

; Ulaşılamıyor
exten => congestion,1,NoOp(=== Ulaşılamıyor ===)
    same => n,AGI(update_call_status.php,${CALL_ID},congestion)
    same => n,Hangup()
