; ============================================
; Otomatik Arama Sistemi Dialplan (FastAGI)
; ============================================
; Bu versiyon FastAGI sunucusu kullanır
; Kullanım: start_fastagi.bat ile sunucuyu başlatın

[auto-calls]
; Otomatik arama başladığında buraya düşer

exten => s,1,NoOp(=== Otomatik Arama Başladı (FastAGI) ===)
    same => n,NoOp(Call ID: ${CALL_ID})
    same => n,NoOp(Phone: ${PHONE_NUMBER})
    same => n,NoOp(Audio: ${AUDIO_FILE})
    
    ; Arama cevaplandı mı kontrolü
    same => n,Set(ANSWEREDTIME=${EPOCH})
    same => n,NoOp(Arama ${ANSWEREDTIME} zamanında cevaplandı)
    
    ; FastAGI ile veritabanına cevaplandığını kaydet
    same => n,AGI(agi://localhost:4573/update_call_status.php?call_id=${CALL_ID}&status=answered)
    
    ; Menü döngüsü başlat
    same => n,Set(LOOP_COUNT=0)
    same => n,Goto(play-message,1)

; Mesajı çal ve tuş bekle
exten => play-message,1,NoOp(=== Mesaj Çalınıyor ===)
    same => n,Set(LOOP_COUNT=$[${LOOP_COUNT} + 1])
    same => n,NoOp(Döngü sayısı: ${LOOP_COUNT})
    
    ; Maksimum 3 deneme
    same => n,GotoIf($[${LOOP_COUNT} > 3]?hangup,1)
    
    ; Ses dosyasını çal ve DTMF bekle (30 saniye)
    same => n,Background(${AUDIO_FILE})
    same => n,WaitExten(30)
    
    ; Tuş basılmazsa tekrar çal
    same => n,Goto(play-message,1)

; Tuş 1: Mesajı tekrar dinle
exten => 1,1,NoOp(=== Tuş 1 Basıldı: Tekrar Dinle ===)
    same => n,AGI(agi://localhost:4573/update_call_dtmf.php?call_id=${CALL_ID}&key=1)
    same => n,Set(LOOP_COUNT=0)
    same => n,Goto(play-message,1)

; Tuş 2: Operatöre aktar
exten => 2,1,NoOp(=== Tuş 2 Basıldı: Operatöre Aktar ===)
    same => n,AGI(agi://localhost:4573/update_call_dtmf.php?call_id=${CALL_ID}&key=2)
    same => n,Playback(transfer)  ; "Operatöre aktarılıyorsunuz..."
    
    ; Operatör kuyruğuna aktar
    same => n,Queue(TAHSILAT,t,,,300)
    
    ; Kuyruk cevap vermediyse
    same => n,Playback(goodbye)
    same => n,Goto(hangup,1)

; Tuş 3: Rezerve
exten => 3,1,NoOp(=== Tuş 3 Basıldı ===)
    same => n,AGI(agi://localhost:4573/update_call_dtmf.php?call_id=${CALL_ID}&key=3)
    same => n,Playback(invalid)
    same => n,Goto(play-message,1)

; Geçersiz tuş
exten => i,1,NoOp(=== Geçersiz Tuş ===)
    same => n,Playback(invalid)
    same => n,Goto(play-message,1)

; Timeout
exten => t,1,NoOp(=== Timeout ===)
    same => n,Playback(goodbye)
    same => n,Goto(hangup,1)

; Arama sonlandır
exten => hangup,1,NoOp(=== Arama Sonlandırılıyor ===)
    same => n,Set(ENDTIME=${EPOCH})
    same => n,Set(DURATION=$[${ENDTIME} - ${ANSWEREDTIME}])
    same => n,NoOp(Arama süresi: ${DURATION} saniye)
    
    ; FastAGI ile veritabanına sonucu kaydet
    same => n,AGI(agi://localhost:4573/update_call_end.php?call_id=${CALL_ID}&duration=${DURATION})
    same => n,Hangup()

; Arama cevapsız
exten => h,1,NoOp(=== Arama Bitti ===)
    same => n,NoOp(Hangup Cause: ${HANGUPCAUSE})
    same => n,NoOp(Dial Status: ${DIALSTATUS})
    
    same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer,1)
    same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy,1)
    same => n,GotoIf($["${DIALSTATUS}" = "CONGESTION"]?congestion,1)
    same => n,Hangup()

; Cevapsız
exten => noanswer,1,NoOp(=== Cevapsız ===)
    same => n,AGI(agi://localhost:4573/update_call_status.php?call_id=${CALL_ID}&status=noanswer)
    same => n,Hangup()

; Meşgul
exten => busy,1,NoOp(=== Meşgul ===)
    same => n,AGI(agi://localhost:4573/update_call_status.php?call_id=${CALL_ID}&status=busy)
    same => n,Hangup()

; Ulaşılamıyor
exten => congestion,1,NoOp(=== Ulaşılamıyor ===)
    same => n,AGI(agi://localhost:4573/update_call_status.php?call_id=${CALL_ID}&status=congestion)
    same => n,Hangup()
